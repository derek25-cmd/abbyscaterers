scripts:
  buildCommand: npm install && npm run build && mkdir -p .next/standalone/apps/admin-portal/.next && cp -r .next/static .next/standalone/apps/admin-portal/.next/static && cp -r public .next/standalone/apps/admin-portal/public
  runCommand: node .next/standalone/apps/admin-portal/server.js

env:
  # Build-time inlined into the client bundle and read by the middleware.
  - variable: NEXT_PUBLIC_CLERK_SIGN_IN_URL
    value: /sign-in
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_CLERK_SIGN_UP_URL
    value: /sign-in
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
    value: /dashboard
    availability:
      - BUILD
      - RUNTIME
