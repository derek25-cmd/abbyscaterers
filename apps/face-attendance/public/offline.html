<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3B3030">
  <title>Abby's Attendance: offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #FCF6E1; color: #3B3030;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px; box-sizing: border-box;
    }
    main { max-width: 32rem; }
    h1 { font-size: 1.75rem; margin: 16px 0 8px; }
    p { font-size: 1.125rem; line-height: 1.5; }
    button {
      margin-top: 16px; padding: 12px 28px; font-size: 1rem; border: 0; border-radius: 12px;
      background: #3B3030; color: #FCF6E1; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="96" height="96" alt="" style="border-radius: 24px">
    <h1>No internet connection</h1>
    <p>This tablet cannot reach the attendance system right now. Clock-in is not recorded while offline.</p>
    <p>Check the Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
